[project]
name = "quanta"
version = "0.1.0"
description = "Quanta AI microservice – intelligent orchestration layer for UI Pay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "groq>=0.36,<1.0",
    "anthropic>=1.0,<2.0",
    "numpy>=1.26.0",
    "av>=12.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.22.0",
    "faster-whisper>=1.0.0",
    "pillow>=10.0.0",
    "paddlepaddle>=3.3.0",
    "paddleocr>=3.7.0",
    "edge-tts==7.2.8",
    "naijalingo==2.0.6",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell Hatchling that the package code is inside the `app` folder
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test",
]

# allow pyrefly to find scripts/ files for testing purposes
[tool.pyrefly]
search-path = [".", "scripts"]